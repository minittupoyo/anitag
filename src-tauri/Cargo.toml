[package]
name = "anitag"
version = "0.1.0"
description = "アニメ自動リネーム & メタデータマネージャー (Native Tauri v2)"
authors = ["minittupoyo"]
edition = "2021"

[lib]
name = "anitag_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
regex = "1.10"
chrono = "0.4"
dirs = "5.0"
tauri-plugin-store = "2"
